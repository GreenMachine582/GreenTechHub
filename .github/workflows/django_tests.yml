name: Django Tests

# Trigger the workflow on push events to any branch except main
on:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Django secrets
      SECRET_KEY: test-secret-key
      ALLOWED_HOSTS: "*"

      # Database (use a test DB)
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_PORT: 5432
      DATABASE_NAME: greentechhub_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: 127.0.0.1

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: greentechhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run migrations
        # ensure your test DB schema is created
        run: |
          python server.py migrate --noinput

      - name: Run Django tests
        run: |
          python server.py test
