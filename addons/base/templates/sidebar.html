<aside id="sidebar" class="sidebar">
  <ul class="sidebar-nav" id="sidebar-nav">

    <li class="nav-item">
      <a class="nav-link {% if site_path == '/home/' %}active{% else %}collapsed{% endif %}" href="/home/">
        <i class="fas fa-house"></i>
        <span>Home</span>
      </a>
    </li><!-- End Home Nav -->

    <li class="nav-heading">Admin</li>

    {% if user.is_authenticated == False %}
      <li class="nav-item">
        <a class="nav-link {% if site_path == '/register/' %}active{% else %}collapsed{% endif %}" href="/register/">
          <i class="fas fa-user-plus"></i>
          <span>Register</span>
        </a>
      </li><!-- End Register Page Nav -->

      <li class="nav-item">
        <a class="nav-link {% if site_path == '/login/' %}active{% else %}collapsed{% endif %}" href="/login/">
          <i class="fas fa-user"></i>
          <span>Login</span>
        </a>
      </li><!-- End Login Page Nav -->
    {% endif %}

  </ul>

  <ul class="sidebar-nav sidebar-nav-bottom" id="sidebar-nav-bottom">

    {% if user.is_authenticated == True %}
      <li>
        <hr class="sidebar-divider">
      </li>
      <li class="nav-item">
        <a class="nav-link {% if site_path == '/logout/' %}active{% else %}collapsed{% endif %}" href="/logout/">
          <i class="fas fa-right-from-bracket"></i>
          <span>Sign Out</span>
        </a>
      </li><!-- End Logout Page Nav -->
    {% endif %}

  </ul>
</aside>
