
<div class="form-check{% if widget.switch %} form-switch{% endif %}">
  <input
    type="checkbox"
    name="{{ widget.name }}"
    {% include "django/forms/widgets/attrs.html" %}
    {% if widget.value %} checked{% endif %}
  >
  {% if widget.attrs.label %}
    <label class="form-check-label" for="{{ widget.attrs.id|default:widget.name }}">
      {{ widget.attrs.label }}
    </label>
  {% endif %}
</div>
