{% extends "base.html" %}
{% load tabulator_tags %}

{% block meta %}
  {% with page_title="Stocks – PyFinBot" %}
    {{ block.super }}
  {% endwith %}
{% endblock %}

{% block pagetitle %}
  <div class="pagetitle">
    <h1>Stocks</h1>
    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'home' %}"><i class="fas fa-house"></i></a></li>
        <li class="breadcrumb-item">PyFinBot</li>
        <li class="breadcrumb-item active">Stocks</li>
      </ol>
    </nav>
  </div><!-- End Page Title -->
{% endblock %}

{% block main %}
  <section class="section stock">
    <a href="{% url 'pyfinbot-stock-form' %}" class="btn btn-primary mb-3">Add Stock</a>
    {% render_tabulator %}
    <script type="text/template" id="stock-action-template">
        <a href="/pyfinbot/stock/form/${id}"
           class="btn btn-sm btn-warning me-1">
          Edit
        </a>
        <form method="post"
              action="/pyfinbot/stock/delete/${id}/"
              style="display:inline;">
          <input type="hidden"
                 name="csrfmiddlewaretoken"
                 value="${csrftoken}">
          <button type="submit"
                  class="btn btn-sm btn-danger"
                  onclick="return confirm('Really delete?');">
            Delete
          </button>
        </form>
      </script>
  </section>
{% endblock %}
